<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Forge</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <section class="dice-panel" aria-label="Dice tray">
        <div class="dice-panel__header">
          <button id="sort-button" class="sort-button" type="button">Sort</button>
          <button id="duplicate-button" class="duplicate-button" type="button" aria-label="Duplicate dice">2x</button>
          <button id="halve-button" class="halve-button" type="button" aria-label="Halve dice">1/2</button>
          <button id="reroll-button" class="reroll-button" type="button">Reroll</button>
          <button id="clear-button" class="clear-button" type="button">Clear</button>
        </div>
        <div id="dice-pile" class="dice-pile" aria-live="polite"></div>
        <div id="dice-totals" class="dice-totals"></div>
      </section>

      <section class="button-panel" aria-label="Roll controls">
        <div id="dice-row" class="button-row button-row--dice" role="group" aria-label="Dice"></div>
        <div id="bonus-row" class="button-row button-row--bonus" role="group" aria-label="Bonus tokens"></div>
        <div id="group-row" class="button-row button-row--group" role="group" aria-label="Groups"></div>
      </section>
    </div>

    <div id="editor-popover" class="popover popover--hidden"></div>

    <script src="./app.js"></script>
  </body>
</html>
