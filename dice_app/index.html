<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Forge</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <section id="dice-panel" class="dice-panel" aria-label="Dice tray">
        <div class="dice-panel__header" data-panel-header>
          <button class="panel-toggle" type="button" data-panel-toggle="dice-panel" aria-label="Toggle dice tray" aria-expanded="true"></button>
          <button id="sort-button" class="sort-button" type="button">Sort</button>
          <button id="duplicate-button" class="duplicate-button" type="button" aria-label="Duplicate dice">2x</button>
          <button id="halve-button" class="halve-button" type="button" aria-label="Halve dice">1/2</button>
          <button id="reroll-button" class="reroll-button" type="button">Reroll</button>
          <button id="clear-button" class="clear-button" type="button">Clear</button>
        </div>
        <div id="dice-pile" class="dice-pile" aria-live="polite"></div>
      </section>

      <section id="totals-panel" class="totals-panel" aria-label="Group totals">
        <div class="totals-panel__header" data-panel-header>
          <button class="panel-toggle" type="button" data-panel-toggle="totals-panel" aria-label="Toggle group totals" aria-expanded="true"></button>
          <span class="totals-panel__title">Group totals</span>
        </div>
        <div id="dice-totals" class="dice-totals"></div>
      </section>

      <section id="presets-panel" class="presets-panel" aria-label="Preset groups">
        <div class="presets-panel__header" data-panel-header>
          <button class="panel-toggle" type="button" data-panel-toggle="presets-panel" aria-label="Toggle preset groups" aria-expanded="true"></button>
          <span class="presets-panel__title">Preset groups</span>
          <button id="preset-save-button" class="preset-save" type="button">Save</button>
        </div>
        <div id="preset-row" class="button-row button-row--presets" role="group" aria-label="Saved presets"></div>
      </section>

      <section id="button-panel" class="button-panel" aria-label="Roll controls">
        <div class="button-panel__header" data-panel-header>
          <button class="panel-toggle" type="button" data-panel-toggle="button-panel" aria-label="Toggle roll controls" aria-expanded="true"></button>
          <span class="button-panel__title">Roll controls</span>
        </div>
        <div id="dice-row" class="button-row button-row--dice" role="group" aria-label="Dice"></div>
        <div id="bonus-row" class="button-row button-row--bonus" role="group" aria-label="Bonus tokens"></div>
        <div id="group-row" class="button-row button-row--group" role="group" aria-label="Groups"></div>
      </section>
    </div>

    <div id="editor-popover" class="popover popover--hidden"></div>

    <script src="./app.js"></script>
  </body>
</html>
